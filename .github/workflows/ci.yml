name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: pip install -r requirements.txt
      - name: byte-compile
        run: python3 -m py_compile agent.py db.py validate.py service.py llm_client.py evals/run_eval.py evals/run_guardrails.py
      - name: accuracy evals
        run: python3 evals/run_eval.py
      - name: guardrail evals
        run: python3 evals/run_guardrails.py
